<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders 4 | Sırasız Listeler</title>
</head>
<body>
    <h1>Sırasız Listeler</h1>
<!-- Sırasız listelerde type parametresinin görevi CSS'e devredilmiştir. -->
<!-- CSS ile madde işaretini değiştirme yöntemini aşağıdaki kodda kullandık. -->
<!-- Madde işaretini değiştirmek için disc, square, circle kullanılır. -->
<!-- Madde işaretini kaldırmak için none kullanılır. -->
<ul style="list-style-type: circle;">
        <li>Yumurta</li>
        <li>Süt</li>
        <li>Tam Buğday Ekmeği</li>
        <li>Kahve Çekirdeği</li>
    </ul>

    <!-- ul>li*8 Hızlı liste oluşturmak için kullanılır.-->

   
</body>
</html>

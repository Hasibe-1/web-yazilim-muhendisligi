<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 9 - Site ve Harita Gömmek (İframe)</title>
    </head>
    <body>
        <h1>Site ve Harita Gömmek (İframe)</h1>

        <h2>YouTube Videosu Gömme</h2>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/DymcYefs4zM?si=Ld_fmOzkEQgDTqg5"
            title="YouTube video player"
            frameborder="0"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>

        <h2>Google Haritası Gömme</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m5!3m3!1m2!1s0x357ca28b61c565cd%3A0x858aedb4e4ea83eb!2sSeul%2C%20G%C3%BCney%20Kore!5e0!3m2!1str!2str!4v1793126494498!5m2!1str!2str"
            width="800"
            height="300"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </body>
</html>
